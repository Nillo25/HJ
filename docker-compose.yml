# docker compose up --build   ->  http://localhost:3000
# One service: the Northline server and, inside the same container, the floor-plan service that reads raster plans (PNG).
services:
  northline:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: server/.env        # model key and prices; optional: without it only known question patterns work
        required: false
      - path: raster/.env        # ANTHROPIC_API_KEY for reading raster plans; optional (without it only the detectors work)
        required: false
    volumes:
      - northline-data:/data     # uploads, question cache and raster scenes survive a restart
    mem_limit: 4g                # YOLO and the model plus parsing a large IFC: 1 GB is not enough
    restart: unless-stopped
volumes:
  northline-data:
