# docker compose up --build   ->  http://localhost:3000
# Two services: the Northline server (DXF, IFC, PDF; the web app) and the floor-plan service that reads raster plans (PNG).
services:
  northline:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: server/.env        # model key and prices; optional: without it only known question patterns work
        required: false
    environment:
      RASTER_URL: http://raster:8000
      TRUST_PROXY: "0"
    depends_on:
      - raster
    volumes:
      - northline-data:/data     # uploads/<hash>/index.db and cache.db survive a restart
    restart: unless-stopped

  raster:
    build: ./raster
    # not published: it has no authentication; only the northline service reaches it
    env_file:
      - path: raster/.env        # ANTHROPIC_API_KEY (optional, see raster/.env.example)
        required: false
    restart: unless-stopped
    # 1 GB is not enough for a large sheet; give it room
    mem_limit: 3g

volumes:
  northline-data:
