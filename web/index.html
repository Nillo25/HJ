<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor plan MVP</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0db; --accent:#d9480f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; }
  select, button, input[type=text] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { cursor:pointer; } button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .status { color:var(--muted); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns: 1fr 380px; height:calc(100vh - 53px); }
  #stage { overflow:auto; padding:16px; position:relative; }
  #stage svg { max-width:100%; height:auto; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  #stage .empty { color:var(--muted); padding:40px; }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #legend { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border:1px solid var(--line); border-radius:12px; font-size:12px; cursor:pointer; user-select:none; }
  .chip i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .chip.off { opacity:.35; }
  #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 10px; border-radius:8px; max-width:92%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#1d1d1f; color:#fff; }
  .bot { align-self:flex-start; background:#f0efeb; }
  .meta { font-size:11px; color:var(--muted); margin-top:4px; }
  .conf-high { color:#2b8a3e; } .conf-medium { color:#e67700; } .conf-low { color:#c92a2a; font-weight:600; }
  form { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
  form input { flex:1; }
  .hints { padding:0 12px 8px; display:flex; flex-wrap:wrap; gap:4px; }
  .hints button { font-size:12px; padding:3px 8px; }
  /* подсветка */
  svg polygon { transition: fill-opacity .15s, stroke-width .15s, opacity .15s; }
  svg.has-hl polygon { opacity:.25; }
  svg.has-hl polygon.hl { opacity:1; fill-opacity:.55 !important; stroke-width:4; stroke:var(--accent) !important; }
  svg polygon.hidden-cls { display:none; }
  #stage.measuring svg { cursor:crosshair; }
  svg .measure { stroke:var(--accent); stroke-width:3; fill:var(--accent); pointer-events:none; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; height:auto; } aside { min-height:60vh; } }
</style>
</head>
<body>
<header>
  <h1>План → объекты → чат</h1>
  <select id="plans"></select>
  <label><input type="file" id="file" accept="image/*" hidden><button id="uploadBtn" type="button">Загрузить скан…</button></label>
  <button id="scaleBtn" type="button" title="кликните две точки на плане и введите расстояние между ними">Масштаб: 2 точки</button>
  <button id="autoScaleBtn" type="button" title="ИИ читает подписи площадей или шкалу на плане (один вызов)">Авто-масштаб</button>
  <span class="status" id="status"></span>
</header>
<main>
  <div id="stage"><div class="empty">Выберите план или загрузите скан.</div></div>
  <aside>
    <div id="legend"></div>
    <div id="log"></div>
    <div class="hints" id="hints"></div>
    <form id="form"><input type="text" id="q" placeholder="например: выдели все туалеты" autocomplete="off"><button class="primary">→</button></form>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
let META = {}, planId = null, history = [];

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function say(text, cls, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.innerHTML = meta; d.appendChild(m); }
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
}

async function loadPlans(select) {
  const list = await api('/api/plans');
  $('#plans').innerHTML = list.map(p => `<option>${p}</option>`).join('') || '<option value="">— нет планов —</option>';
  if (select) $('#plans').value = select;
  if ($('#plans').value) openPlan($('#plans').value);
}

async function openPlan(id) {
  planId = id; history = []; $('#log').innerHTML = '';
  const svgText = await fetch(`/api/plans/${id}/svg`).then(r => r.text());
  $('#stage').innerHTML = svgText;
  const svg = $('#stage svg');
  svg.querySelector('image')?.setAttribute('href', `/api/plans/${id}/image`);
  const scene = await api(`/api/plans/${id}`);
  const counts = {};
  [...scene.objects, ...scene.rooms].forEach(o => counts[o.class] = (counts[o.class] || 0) + 1);
  $('#legend').innerHTML = Object.entries(counts).map(([c, n]) =>
    `<span class="chip" data-cls="${c}"><i style="background:${META.colors[c]}"></i>${META.labels[c] || c} · ${n}</span>`).join('');
  showStatus(scene);
  say(`План «${id}» загружен. Спросите что-нибудь.`, 'bot');
}

function scaleText(meta) {
  const s = meta.scale || {};
  if (!meta.px_per_m) return 'масштаб неизвестен' + (s.detail ? ` (${s.detail})` : '');
  const src = {manual: 'вручную', area_labels: 'по подписям площадей', scale_bar: 'по шкале'}[s.source] || s.source || '';
  return `масштаб ${meta.px_per_m.toFixed(1)} px/м · ${src}${s.confidence ? ' · ' + s.confidence : ''}`;
}
function showStatus(scene) {
  $('#status').textContent = `${scene.objects.length} объектов, ${scene.rooms.length} комнат · ` +
    `источник: ${scene.objects[0]?.source || '—'} · ${scaleText(scene.meta || {})}`;
}

// ---- ручной масштаб: два клика по плану + реальная длина ----
const UNIT_ALIASES = {'m': 'm', 'м': 'm', 'cm': 'cm', 'см': 'cm', 'mm': 'mm', 'мм': 'mm',
                      'ft': 'ft', "'": 'ft', 'фут': 'ft', 'футов': 'ft', 'фута': 'ft', 'in': 'in', '"': 'in', 'дюйм': 'in', 'дюймов': 'in'};
function parseLength(text) {
  const t = (text || '').trim().replace(',', '.');
  const m = t.match(/^\d+(\.\d+)?/);
  const num = m ? parseFloat(m[0]) : 0;
  if (!(num > 0)) return null;
  const unitWord = t.slice(m[0].length).trim().toLowerCase() || 'm';
  const unit = UNIT_ALIASES[unitWord];
  return unit ? {length: num, unit} : null;
}
let measure = null;
function svgPoint(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function addSvg(svg, tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
  svg.appendChild(n);
}
$('#scaleBtn').onclick = () => {
  const svg = $('#stage svg'); if (!svg) return;
  svg.querySelectorAll('.measure').forEach(n => n.remove());
  measure = []; $('#stage').classList.add('measuring');
  say('Кликните по плану начало и конец отрезка известной длины (шкала, размерная линия).', 'bot');
};
$('#stage').addEventListener('click', async e => {
  if (!measure) return;
  const svg = $('#stage svg'); if (!svg || !svg.contains(e.target)) return;
  const p = svgPoint(svg, e); measure.push(p);
  addSvg(svg, 'circle', {cx: p.x, cy: p.y, r: Math.max(svg.viewBox.baseVal.width / 300, 4), class: 'measure'});
  if (measure.length < 2) return;
  const [a, b] = measure; measure = null; $('#stage').classList.remove('measuring');
  addSvg(svg, 'line', {x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'measure'});
  const len = parseLength(prompt('Реальная длина отрезка (например: 5 m, 80 ft, 3600 mm):', ''));
  if (!len) { say('Масштаб не задан: не понял длину. Пример: 5 m или 80 ft.', 'bot'); return; }
  try {
    const r = await api(`/api/plans/${planId}/scale`, { method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, ...len }) });
    say(`Масштаб задан: ${r.detail} → ${r.px_per_m.toFixed(1)} px/м. Теперь площади считаются в м².`, 'bot');
    showStatus(await api(`/api/plans/${planId}`));
  } catch (err) { say('Ошибка: ' + err.message, 'bot'); }
});
$('#autoScaleBtn').onclick = async () => {
  if (!planId) return;
  say('Ищу на плане подписи площадей или шкалу…', 'bot');
  try {
    const r = await api(`/api/plans/${planId}/scale/auto`, { method: 'POST' });
    say(r.px_per_m ? `Масштаб: ${r.px_per_m.toFixed(1)} px/м (${r.detail}, уверенность ${r.confidence}).`
                   : `Не получилось: ${r.detail}.`, 'bot', r.vlm_cost_usd != null ? `VLM · $${r.vlm_cost_usd}` : '');
    showStatus(await api(`/api/plans/${planId}`));
  } catch (err) { say('Ошибка: ' + err.message, 'bot'); }
};

function applyAction(a) {
  const svg = $('#stage svg'); if (!svg) return;
  svg.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  svg.classList.remove('has-hl');
  if (a.type === 'highlight' && a.ids.length) {
    a.ids.forEach(id => svg.getElementById(id)?.classList.add('hl'));
    svg.classList.add('has-hl');
  }
}

$('#legend').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  chip.classList.toggle('off');
  $('#stage svg')?.querySelectorAll(`polygon.${chip.dataset.cls}`).forEach(p => p.classList.toggle('hidden-cls', chip.classList.contains('off')));
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q || !planId) return;
  $('#q').value = ''; say(q, 'me');
  try {
    const r = await api(`/api/plans/${planId}/chat`, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:q, history }) });
    applyAction(r.action);
    const conf = r.confidence ? `<span class="conf-${r.confidence}">${r.confidence}</span> · ` : '';
    say(r.reply, 'bot', `${conf}${r.parsed_by} → ${r.answered_by || '—'} · ${r.latency_ms} мс · $${r.cost_usd}`);
    history.push({role:'user', content:q}, {role:'assistant', content:r.reply});
  } catch (err) { say('Ошибка: ' + err.message, 'bot'); }
});

['выдели все туалеты', 'сколько окон', 'покажи двери', 'какие комнаты', 'что в санузле', 'площадь кухни', 'очисти']
  .forEach(h => { const b = document.createElement('button'); b.type='button'; b.textContent = h;
    b.onclick = () => { $('#q').value = h; $('#form').requestSubmit(); }; $('#hints').appendChild(b); });

$('#plans').addEventListener('change', e => e.target.value && openPlan(e.target.value));
$('#uploadBtn').onclick = () => $('#file').click();
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#status').textContent = 'распознаю…';
  const fd = new FormData(); fd.append('file', f);
  try { const r = await api('/api/plans', { method:'POST', body:fd }); await loadPlans(r.id); }
  catch (err) { $('#status').textContent = 'Ошибка: ' + err.message; }
  e.target.value = '';
});

(async () => {
  META = await api('/api/meta');
  if (!META.model) $('#uploadBtn').title = 'модель не задана (FP_MODEL) — загрузка недоступна';
  await loadPlans();
})();
</script>
</body>
</html>
